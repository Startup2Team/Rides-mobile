name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Tests, typecheck, and whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Run mobile tests
        run: pnpm --filter @workspace/mobile test

      - name: Run mobile typecheck
        run: pnpm --filter @workspace/mobile typecheck

      - name: Generate staging shadow health snapshot
        run: pnpm --dir artifacts/mobile run report:staging-health -- --json --output artifacts/mobile/staging-health-report.json

      - name: Upload staging shadow health snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-shadow-health-report
          path: artifacts/mobile/staging-health-report.json
          if-no-files-found: error

      - name: Compare staging shadow health snapshot against baseline
        run: pnpm --dir artifacts/mobile run compare:staging-health -- --current artifacts/mobile/staging-health-report.json --baseline artifacts/mobile/docs/baselines/staging-health-baseline.json

      - name: Review HYBRID candidates
        run: pnpm --dir artifacts/mobile run review:hybrid-candidates

      - name: Plan HYBRID rollout
        run: pnpm --dir artifacts/mobile run plan:hybrid-rollout -- --all

      - name: Check staging backend connection
        run: pnpm --dir artifacts/mobile run check:staging-connection

  mobile-release-validation:
    name: Production export and Android config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_MAPBOX_TOKEN: pk.ci_release_validation_not_a_real_token
      EXPO_PUBLIC_SENTRY_ENVIRONMENT: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile release environment
        run: pnpm --filter @workspace/mobile release:validate-env

      - name: Validate Expo public configuration
        run: pnpm --filter @workspace/mobile release:config
        env:
          NODE_ENV: production

      - name: Export production Android bundle
        run: pnpm --filter @workspace/mobile release:export:android
        env:
          NODE_ENV: production

      - name: Validate Android native configuration
        run: pnpm --filter @workspace/mobile release:prebuild:android
        env:
          NODE_ENV: production
