name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    name: Tests, typecheck, and whitespace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Run mobile tests
        run: pnpm --filter @workspace/mobile test

      - name: Run mobile typecheck
        run: pnpm --filter @workspace/mobile typecheck
